
<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SOODY | 단어 맞추기</title>
  <link rel="stylesheet" href="./mobile-design.css">
</head>

<body>
  <div class="phone quiz-page">

    <header class="topbar">
      <a href="#" class="close" aria-label="닫기">×</a>

      <div class="progress">
        <span class="progress-fill" style="width:80%"></span>
      </div>

      <span class="progress-count">4/5</span>
    </header>

    <h1>캐릭터의 동작을 보고 뜻을 맞춰보세요.</h1>

    <section class="lesson quiz-lesson">
      <img
        class="tutor-gif"
        src="./images/sign-tutor2.png"
        alt="수어 동작"
      >
    </section>

    <div class="quiz-bottom">
      <div class="quiz-options">
        <button type="button" class="quiz-option" data-answer="친구">만나다</button>
        <button type="button" class="quiz-option" data-answer="학교">숫자 7</button>
        <button type="button" class="quiz-option" data-answer="선생님">친구</button>
      </div>
    </div>

    <!-- 정답 / 오답 바텀시트 -->
    <div class="quiz-overlay" id="quizOverlay" aria-hidden="true">
      <div class="quiz-result-sheet" role="dialog" aria-modal="true">
        <div class="quiz-result-title">
          <span class="quiz-result-icon" id="resultIcon">✓</span>
          <strong id="resultTitle"></strong>
        </div>

        <p class="quiz-result-description" id="resultDescription"></p>

        <button type="button" id="resultButton"></button>
      </div>
    </div>

  </div>

  <script>
    
const options = document.querySelectorAll(".quiz-option");
const overlay = document.getElementById("quizOverlay");
const resultTitle = document.getElementById("resultTitle");
const resultDescription = document.getElementById("resultDescription");
const resultButton = document.getElementById("resultButton");
const resultIcon = document.getElementById("resultIcon");

let isWaiting = false;

options.forEach(button => {
  button.addEventListener("click", () => {
    // 2초 대기 중에는 다른 카드 선택 불가
    if (isWaiting) return;

    isWaiting = true;

    const isCorrect = button.dataset.answer === "학교";

    // 기존 선택 상태 초기화
    options.forEach(option => {
      option.classList.remove("selected", "correct", "wrong");
    });

    // 1. 선택한 카드에 정답/오답 색상 표시
    button.classList.add(isCorrect ? "correct" : "wrong");

    // 2. 2초 후 바텀시트 표시
    setTimeout(() => {
      overlay.classList.toggle("is-wrong", !isCorrect);

      if (isCorrect) {
        resultIcon.textContent = "✓";
        resultTitle.textContent = "잘했어요!";
        resultDescription.textContent = "정확하게 맞혔어요!";
        resultButton.textContent = "다음으로";
      } else {
        resultIcon.textContent = "×";
        resultTitle.textContent = "다시 한번 해볼까요?";
        resultDescription.textContent =
          "동작을 천천히 확인하고 다시 선택해 보세요.";
        resultButton.textContent = "다시하기 ↻";
      }

      overlay.classList.add("show");
      overlay.setAttribute("aria-hidden", "false");

      isWaiting = false;

      resultButton.onclick = () => {
        if (isCorrect) {
        window.location.href = "./friend2.html";
          overlay.classList.remove("show");
        } else {
          overlay.classList.remove("show");

          // 오답일 경우 카드 초기화
          options.forEach(option => {
            option.classList.remove("selected", "correct", "wrong");
          });
        }

        overlay.setAttribute("aria-hidden", "true");
      };
    }, 1500);
  });
});

  </script>
</body>
</html>
